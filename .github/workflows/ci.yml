name: CI

on:
  push:
    branches:
      - main
      - "arena/**" # Permite rodar o CI automaticamente nas branches geradas pelo Agente Arena
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"
  workflow_dispatch: # Permite disparar o build manualmente na aba Actions

env:
  DLSS_SDK_REF: v310.7.0
  DLSS_SDK_PATH: third_party/DLSS
  # FSR 3.1 lives in the AMD FidelityFX SDK; the shim links the signed prebuilt VK runtime, so
  # only the prebuilt DLL + the ffx_api headers need checking out (sparse).
  FFX_SDK_REF: v1.1.4
  FFX_SDK_PATH: third_party/FidelityFX-SDK
  # NRD (NVIDIA Real-time Denoisers) source; its CMake fetches the matching NRI itself.
  NRD_SDK_REF: v4.17.3
  NRD_SDK_PATH: third_party/NRD
  # XeSS lives in Intel's xess repo; the shim loads the prebuilt libxess.dll at run time, so only
  # the prebuilt DLL + headers need checking out (sparse).
  XESS_SDK_REF: v2.1.1
  XESS_SDK_PATH: third_party/xess
  NGX_SHIM_CONFIG: release
  NGX_VENDOR_CONFIG: rel
  VULKAN_SDK_VERSION: 1.4.350.0
  VULKAN_SDK_SHA256: b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2

jobs:
  native-windows:
    name: Build Windows NGX shim
    runs-on: windows-2022

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure NGX shim
        shell: pwsh
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build NGX shim
        shell: pwsh
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Upload Windows NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-windows-x64
          path: build/native/ngx_shim/release/ngxshim.dll
          if-no-files-found: error

      - name: Checkout AMD FidelityFX SDK
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: ${{ env.FFX_SDK_REF }}
          path: ${{ env.FFX_SDK_PATH }}
          sparse-checkout: |
            PrebuiltSignedDLL
            ffx-api/include

      - name: Configure FSR shim
        shell: pwsh
        env:
          FFX_SDK: ${{ github.workspace }}/${{ env.FFX_SDK_PATH }}
        run: >
          cmake -S native/fsr_shim
          -B build/cmake/fsr_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build FSR shim
        run: cmake --build build/cmake/fsr_shim --config Release

      - name: Upload Windows FSR shim
        uses: actions/upload-artifact@v4
        with:
          name: fsrshim-windows-x64
          path: |
            build/native/fsr_shim/release/fsrshim.dll
            build/native/fsr_shim/release/amd_fidelityfx_vk.dll
          if-no-files-found: error

      - name: Checkout NRD
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-RTX/NRD
          ref: ${{ env.NRD_SDK_REF }}
          path: ${{ env.NRD_SDK_PATH }}

      - name: Configure NRD shim
        shell: pwsh
        env:
          NRD_SDK: ${{ github.workspace }}/${{ env.NRD_SDK_PATH }}
        run: >
          cmake -S native/nrd_shim
          -B build/cmake/nrd_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build NRD shim
        run: cmake --build build/cmake/nrd_shim --config Release

      - name: Upload Windows NRD shim
        uses: actions/upload-artifact@v4
        with:
          name: nrdshim-windows-x64
          path: build/native/nrd_shim/release/nrdshim.dll
          if-no-files-found: error

      - name: Checkout Intel XeSS SDK
        uses: actions/checkout@v4
        with:
          repository: intel/xess
          ref: ${{ env.XESS_SDK_REF }}
          path: ${{ env.XESS_SDK_PATH }}
          sparse-checkout: |
            bin
            inc

      - name: Configure XeSS shim
        shell: pwsh
        env:
          XESS_SDK: ${{ github.workspace }}/${{ env.XESS_SDK_PATH }}
        run: >
          cmake -S native/xess_shim
          -B build/cmake/xess_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build XeSS shim
        run: cmake --build build/cmake/xess_shim --config Release

      - name: Upload Windows XeSS shim
        uses: actions/upload-artifact@v4
        with:
          name: xessshim-windows-x64
          path: |
            build/native/xess_shim/release/xessshim.dll
            build/native/xess_shim/release/libxess.dll
          if-no-files-found: error

  native-linux:
    name: Build Linux NGX shim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools spirv-tools libvulkan-dev

      - name: Configure NGX shim
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
          VULKAN_SDK: /usr
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build NGX shim
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Upload Linux NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-linux-x64
          path: build/native/ngx_shim/release/libngxshim.so
          if-no-files-found: error

  package:
    name: Build bundled mod jar
    runs-on: ubuntu-latest
    needs:
      - native-windows
      - native-linux

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan SDK shader tools
        run: |
          archive="vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/${archive}"
          
          mkdir -p "${RUNNER_TEMP}/vulkan-sdk-extract"
          curl --fail --location --retry 3 --retry-delay 5 --output "${archive}" "${url}"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check
          
          tar -xf "${archive}" -C "${RUNNER_TEMP}/vulkan-sdk-extract"
          
          # Localiza dinamicamente o diretório x86_64 para evitar quebras de caminho
          sdk_root=$(find "${RUNNER_TEMP}/vulkan-sdk-extract" -type d -name "x86_64" | head -n 1)

          echo "VULKAN_SDK=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/bin" >> "${GITHUB_PATH}"
          
          export PATH="${sdk_root}/bin:$PATH"
          "${sdk_root}/bin/glslangValidator" --version || true
          "${sdk_root}/bin/slangc" -version || true
          "${sdk_root}/bin/spirv-val" --version || true

      - name: Download NGX shims
        uses: actions/download-artifact@v4
        with:
          pattern: ngxshim-*
          path: build/native/ngx_shim/release
          merge-multiple: true

      - name: Download FSR shims
        uses: actions/download-artifact@v4
        with:
          pattern: fsrshim-*
          path: build/native/fsr_shim/release
          merge-multiple: true

      - name: Download NRD shims
        uses: actions/download-artifact@v4
        with:
          pattern: nrdshim-*
          path: build/native/nrd_shim/release
          merge-multiple: true

      - name: Download XeSS shims
        uses: actions/download-artifact@v4
        with:
          pattern: xessshim-*
          path: build/native/xess_shim/release
          merge-multiple: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bundled jar
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: |
          set -o pipefail
          bash ./gradlew build \
            -PngxPlatforms=windows-x64,linux-x64 \
            -PngxVendorConfig=${{ env.NGX_VENDOR_CONFIG }} \
            -PngxShimConfig=${{ env.NGX_SHIM_CONFIG }} \
            --stacktrace --info 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build/**/*.log
            **/hs_err*.log
          if-no-files-found: warn

      - name: Upload bundled jar
        uses: actions/upload-artifact@v4
        with:
          name: caustica-bundled-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
